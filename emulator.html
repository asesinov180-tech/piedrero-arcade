<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Piedrero Arcade - EmulatorJS</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

    <div id="game"></div>

    <script>
        window.EJS_player = "#game";

        window.EJS_core = "nes";

        window.EJS_gameUrl = "";

        window.EJS_gameName = "Mi primer juego";

        window.EJS_startOnLoaded = false;

        window.EJS_DEBUG_XX = true;

        window.EJS_pathtodata =
            "https://cdn.emulatorjs.org/latest/data/";
    </script>

    <script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>

</body>

</html>
